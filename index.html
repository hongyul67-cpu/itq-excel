<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITQ 엑셀</title>
<!-- 수업용 「모두 같은 문제」 — 다른 공용 스크립트보다 먼저 -->
<script src="https://hongyul67-cpu.github.io/links/fixorder.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --tx:#1c2430; --dim:#6b7684;
    --pri:#2563eb; --ok:#12a150; --no:#e5484d; --warn:#f5a524;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:15px/1.65 "Pretendard","맑은 고딕",system-ui,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:16px 14px 110px}

  header{display:flex;align-items:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:800}
  header .sub{color:var(--dim);font-size:13px}

  /* 탭 — class-mode.js 가 .tab 을 인식합니다 */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);
       cursor:pointer;font-weight:700;font-size:14px;color:var(--dim)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .card .body{color:#333}
  .kw{background:#eef4ff;color:#1d4ed8;border-radius:6px;padding:1px 6px;font-weight:700}
  .key{display:inline-block;background:#1f2937;color:#fff;border-radius:6px;padding:1px 7px;
       font-size:12.5px;font-weight:700;letter-spacing:.3px}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;
       padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
  .btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* 문제 — class-mode.js 가 .choice / .explain 을 인식합니다 */
  .qnum{color:var(--dim);font-size:13px;font-weight:700}
  .qtext{font-size:17px;font-weight:700;margin:6px 0 12px;line-height:1.5}
  .choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
          border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px}
  .choice:hover{border-color:var(--pri)}
  .choice.correct{border-color:var(--ok);background:#eafaf1}
  .choice.wrong{border-color:var(--no);background:#fdeeee}
  .choice.picked{border-width:2px}
  .explain{background:#f8fafc;border-left:3px solid var(--pri);border-radius:0 8px 8px 0;
           padding:10px 14px;margin-top:10px;color:#334}
  .progress{height:8px;background:#e8ebf0;border-radius:99px;overflow:hidden;margin:10px 0 16px}
  .progress > i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}

  .empty{color:var(--dim);text-align:center;padding:34px 10px}
  .score{font-size:34px;font-weight:900;letter-spacing:-1px}
  .muted{color:var(--dim);font-size:13px}
  .pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:2px 10px;
        font-size:12px;font-weight:700;color:var(--dim)}

  /* 배점표 */
  table.pt{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  table.pt th,table.pt td{border:1px solid var(--line);padding:7px 9px;text-align:left}
  table.pt th{background:#f1f4f9;font-size:13px;color:#334}
  table.pt td.n{text-align:right;font-weight:800;white-space:nowrap}
  .scroll{overflow-x:auto}

  /* 실습 세트 체크리스트 */
  .setbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .setbtn{padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);
          cursor:pointer;font-weight:700;font-size:13.5px;color:var(--dim)}
  .setbtn.on{background:#111827;border-color:#111827;color:#fff}
  .step{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;
        padding:11px 13px;margin-bottom:8px;background:var(--card);cursor:pointer}
  .step:hover{border-color:var(--pri)}
  .step.done{background:#f2fbf6;border-color:#bfe6cf}
  .step .bx{flex:0 0 22px;height:22px;border:2px solid #cbd3dd;border-radius:6px;margin-top:2px;
            display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:900}
  .step.done .bx{background:var(--ok);border-color:var(--ok)}
  .step .st{flex:1}
  .step .st b{display:block;font-size:15px}
  .step .st span{display:block;color:var(--dim);font-size:13.5px;margin-top:2px}
  .setnote{background:#fffbeb;border:1px solid #fde68a;border-radius:11px;padding:11px 14px;
           font-size:13.5px;color:#78350f;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>ITQ 엑셀</h1>
    <span class="sub" id="hdSub"></span>
  </header>

  <div class="tabs">
    <button class="tab on" data-view="learn">📖 배우기</button>
    <button class="tab"    data-view="practice">✏️ 연습 8문항</button>
    <button class="tab"    data-view="sets">🧪 실습 세트</button>
    <button class="tab"    data-view="exam">🏁 종합시험 20문항</button>
    <button class="tab"    data-view="wrong">📕 오답노트</button>
  </div>

  <div id="view"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   ITQ 엑셀 — 한글엑셀(과목코드 1122) 실기 대비 학습도구
   규약: https://github.com/hongyul67-cpu/links/blob/master/CONVENTIONS.md
   자료 근거: ITQ 엑셀 교재의 출제유형 01~07 구성 · 출제예상 모의고사 문제지의
             수험자 유의사항 · 답안 작성요령 · 작업별 배점(240/80/80/100)
   ══════════════════════════════════════════════════════════════ */

/* ── 1) 배우기 — 정답을 다 보여 주는 단계. 테스트보다 반드시 앞에 ── */
const LEARN = [
  { unit:'시험 개요', t:'ITQ 엑셀은 이렇게 생겼습니다', body:
    '과목 <span class="kw">한글엑셀</span> · 과목코드 <span class="kw">1122</span> · 시험시간 <span class="kw">60분</span> · ' +
    '총점 <span class="kw">500점</span>.<br>' +
    '한 통합 문서 안에 <b>시트 네 장</b>을 만드는 것이 시험 전부입니다. 객관식이 없습니다.' +
    '<div class="scroll"><table class="pt">' +
    '<tr><th>시트</th><th>하는 일</th><th>배점</th></tr>' +
    '<tr><td>제1작업</td><td>표 서식 작성 및 값 계산</td><td class="n">240점</td></tr>' +
    '<tr><td>제2작업</td><td>목표값 찾기 및 필터 <b>또는</b> 필터 및 서식</td><td class="n">80점</td></tr>' +
    '<tr><td>제3작업</td><td>정렬 및 부분합 <b>또는</b> 피벗 테이블</td><td class="n">80점</td></tr>' +
    '<tr><td>제4작업</td><td>그래프</td><td class="n">100점</td></tr>' +
    '<tr><th colspan="2">합계</th><th style="text-align:right">500점</th></tr>' +
    '</table></div>' +
    '<div style="margin-top:8px"><b>제1작업이 240점</b>으로 절반 가까이 됩니다. ' +
    '게다가 제2·제3·제4작업이 모두 제1작업을 복사해 쓰므로, <b>제1작업이 틀리면 전부 틀립니다.</b></div>' },

  { unit:'유형 01 · 답안 준비', t:'답안 작성요령 — 여기서 실격이 갈립니다', body:
    '· 문제는 총 4단계, 즉 <b>제1작업부터 제4작업까지</b> 구성되어 있으며 반드시 <b>제1작업부터 순서대로</b> 작성합니다.<br>' +
    '· 답안 시트 이름은 <span class="kw">제1작업</span> <span class="kw">제2작업</span> ' +
    '<span class="kw">제3작업</span> <span class="kw">제4작업</span> 이어야 하며, ' +
    '<b>답안 시트 이외의 것은 감점</b> 처리됩니다.<br>' +
    '· <b>각 시트를 파일로 나누어 작업해서 저장할 경우 실격</b>입니다.<br>' +
    '· 모든 작업시트의 <b>A열은 열 너비 「1」</b>로, 나머지 열은 적당하게 조절합니다.<br>' +
    '· 모든 작업시트의 테두리는 ≪출력형태≫와 같이 작업합니다.<br>' +
    '· 파일명은 「수험번호-성명」(예: 12345678-홍길동.xlsx), 저장 위치는 <span class="kw">내 PC\\문서\\ITQ</span> 입니다.<br>' +
    '· <b>시트명 순서가 차례대로 제1작업 → 제4작업이 되도록</b> 해야 합니다.' },

  { unit:'유형 01 · 답안 준비', t:'시작하자마자 하는 일 (3분)', body:
    '① 새 통합 문서를 열고 시트를 <b>세 장 더</b> 만들어 넉 장으로 맞춥니다.<br>' +
    '② 시트 이름을 제1작업·제2작업·제3작업으로 바꿉니다. ' +
    '(제4작업은 그래프를 <b>새 시트</b>로 옮길 때 생기므로 지금은 만들지 않습니다.)<br>' +
    '③ 시트 <b>세 장을 함께 선택(그룹화)</b>한 뒤 <b>A열 너비를 1</b>로 한 번에 지정합니다.<br>' +
    '④ 「수험번호-성명」으로 저장합니다.<br><br>' +
    '온라인 절차는 <span class="kw">수험자 등록 ⇒ 시험 시작 ⇒ 답안파일 저장 ⇒ 답안 전송 ⇒ 시험 종료</span> 입니다. ' +
    '<b>저장하지 않고 전송하면 이전에 저장된 내용이 전송됩니다.</b>' },

  { unit:'유형 02 · 제1작업', t:'데이터 입력과 제목 작성', body:
    '· 모든 데이터의 서식 — 글꼴 <span class="kw">굴림, 11pt</span>. ' +
    '정렬은 <b>숫자 및 회계 서식은 오른쪽 정렬</b>, <b>나머지 서식은 가운데 정렬</b>. ' +
    '예외는 ≪출력형태≫를 따릅니다.<br>' +
    '· 제목 — <b>도형</b>과 <b>그림자</b>를 이용해 만들고 그 안에 제목을 입력한 뒤 서식을 줍니다 ' +
    '(예: 글꼴 굴림 24pt 검정 굵게, 채우기 노랑).<br>' +
    '· 결재란 — <b>임의의 셀</b>에 만들어 두고 <b>그림으로 복사</b> 기능으로 붙인 뒤 <b>원본은 삭제</b>합니다. ' +
    '결재란을 표 옆에 직접 그리면 열 너비가 틀어집니다.' },

  { unit:'유형 03 · 제1작업', t:'셀 서식 — 자주 나오는 다섯 가지', body:
    '① <b>영역 채우기</b> — 지정된 영역을 지시된 색(주황 등)으로<br>' +
    '② <b>유효성 검사</b> — 어떤 셀에 목록이 <b>선택 표시</b>되도록 (원본 범위를 지정)<br>' +
    '③ <b>사용자 지정 표시 형식</b> — 숫자 뒤에 단위를 붙여 보이게 (예: 500 → 500W/h). ' +
    '값 자체를 고쳐 「500W/h」라고 입력하면 계산이 깨집니다. <b>서식으로만</b> 붙입니다.<br>' +
    '④ <b>이름 정의</b> — 어떤 영역에 이름을 붙여 두고 함수에서 그 이름을 씁니다<br>' +
    '⑤ <b>조건부 서식</b> — 대개 <b>수식을 이용</b>해 「~이상인 행 전체」에 글꼴 서식을 줍니다' },

  { unit:'유형 04 · 제1작업', t:'값 계산 — 함수는 반드시 지시된 것으로', body:
    '문제지에 「(1)~(6) 셀은 반드시 <b>주어진 함수를 이용</b>하여 값을 구하시오 ' +
    '(<b>결과값을 직접 입력하면 해당 셀은 0점 처리됨</b>)」이라고 적혀 있습니다.' +
    '<div class="scroll"><table class="pt">' +
    '<tr><th>물어보는 말</th><th>함께 지시되는 함수</th></tr>' +
    '<tr><td>코드의 몇 번째 값이 1이면 A, 2이면 B …</td><td>CHOOSE, MID</td></tr>' +
    '<tr><td>내림차순 순위</td><td>RANK.EQ</td></tr>' +
    '<tr><td>조건에 맞는 것의 개수 (표 전체를 조건으로)</td><td>DCOUNTA</td></tr>' +
    '<tr><td>조건에 맞는 값의 합 / 개수</td><td>SUMIF, COUNTIF</td></tr>' +
    '<tr><td>가장 큰 값 / 가장 작은 값</td><td>MAX, MIN</td></tr>' +
    '<tr><td>선택한 코드에 해당하는 값 찾아오기</td><td>VLOOKUP</td></tr>' +
    '<tr><td>평균</td><td>AVERAGE, ROUND 와 함께</td></tr>' +
    '<tr><td>결과값에 「개」 「명」 을 붙이기</td><td>&amp; 연산자</td></tr>' +
    '</table></div>' +
    '<div style="margin-top:8px">「(예 : 1개)」처럼 결과 모양을 알려 주면 <b>&amp; 연산자</b>로 글자를 이어 붙이라는 뜻입니다.</div>' },

  { unit:'유형 05 · 제2작업', t:'제2작업은 두 가지 중 하나가 나옵니다 (80점)', body:
    '공통 — <b>제1작업 시트의 지정 영역을 복사해 제2작업 시트의 「B2」 셀부터 붙여넣기</b> 한 뒤 시작합니다.<br><br>' +
    '<b>㉠ 목표값 찾기 및 필터</b><br>' +
    '· 셀을 <b>병합</b>하고 설명을 입력한 뒤 옆 셀에 <b>AVERAGE</b> 등으로 값을 구합니다(테두리·가운데 맞춤).<br>' +
    '· <b>목표값 찾기</b> — 「그 평균이 ○○이 되려면 어떤 값이 얼마가 되어야 하는가」를 구합니다. ' +
    '[데이터] → 가상 분석 → 목표값 찾기.<br>' +
    '· <b>고급 필터</b> — 조건 범위와 복사 위치의 <b>셀 주소가 문제에 못박혀</b> 있습니다(예: 조건 범위 B14, 복사 위치 B18).<br><br>' +
    '<b>㉡ 필터 및 서식</b><br>' +
    '· 고급 필터로 뽑아낸 뒤, 결과 셀을 <b>채우기 없음</b>으로 바꾸고 지정된 <b>표 스타일</b>을 적용합니다.<br>' +
    '· <b>머리글 행 · 줄무늬 행</b> 체크까지 조건에 들어갑니다.' },

  { unit:'유형 05 · 제2작업', t:'고급 필터의 조건 쓰는 법', body:
    '「A로 시작하<b>거나</b> B 이상인」 → 두 조건을 <b>다른 줄</b>에 씁니다 (OR)<br>' +
    '「A이<b>면서</b> B 이상인」 → 두 조건을 <b>같은 줄</b>에 씁니다 (AND)<br><br>' +
    '· 「\'H\'로 시작하는」 은 조건 칸에 <span class="kw">H*</span> 라고 씁니다.<br>' +
    '· 「\'50\' 이하인」 은 <span class="kw">&lt;=50</span> 이라고 씁니다.<br>' +
    '· 조건 칸의 <b>머리글은 원본 표의 머리글과 글자가 똑같아야</b> 합니다. 한 글자만 달라도 걸리지 않습니다.<br>' +
    '· 추출할 열이 정해져 있으면 <b>복사 위치에 그 머리글만 미리 적어</b> 두고 필터를 실행합니다.' },

  { unit:'유형 06 · 제3작업', t:'제3작업도 두 가지 중 하나 (80점)', body:
    '<b>㉠ 정렬 및 부분합</b><br>' +
    '· ≪출력형태≫를 보고 <b>어느 열로 정렬했는지</b> 먼저 알아냅니다. 정렬을 먼저 하지 않으면 부분합이 뒤죽박죽 됩니다.<br>' +
    '· 부분합은 대개 <b>두 번</b> 넣습니다(예: 개수 한 번, 평균 한 번). ' +
    '두 번째 부분합에서는 <b>「새로운 값으로 대치」 체크를 풀어야</b> 첫 번째가 살아 있습니다.<br>' +
    '· 「개요[윤곽] – 지우시오」 → [데이터] → 그룹 해제 → <b>윤곽 지우기</b>.<br><br>' +
    '<b>㉡ 피벗 테이블</b><br>' +
    '· 숫자 필드를 <b>그룹화</b>해 구간으로 묶습니다(예: 1-300, 301-600).<br>' +
    '· <b>레이블이 있는 셀 병합 및 가운데 맞춤</b> 은 피벗 테이블 옵션에 있습니다.<br>' +

/* ── 4) 설정 ── */
const CFG = {
  practiceN : 8,
  examN     : 20,
  storeKey  : 'itq-excel_v1',
  toolName  : 'ITQ 엑셀',
  appName   : '엑셀',
};

/* ══════════════ 여기부터는 대개 손대지 않습니다 ══════════════ */

const $  = s => document.querySelector(s);
const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

const ST = load();
function load(){
  try{ return Object.assign({wrong:[],sets:{}}, JSON.parse(localStorage.getItem(CFG.storeKey)||'{}')); }
  catch(e){ return {wrong:[],sets:{}}; }
}
function save(){ try{ localStorage.setItem(CFG.storeKey, JSON.stringify(ST)); }catch(e){} }

let quiz = null;
let lastResult = null;
let curSet = SETS[0].key;

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    render(t.dataset.view);
  };
});

function render(view){
  const v = $('#view');
  v.innerHTML = '';
  if(view==='learn')    return renderLearn(v);
  if(view==='practice') return startQuiz(v,'practice');
  if(view==='exam')     return startQuiz(v,'exam');
  if(view==='sets')     return renderSets(v);
  if(view==='wrong')    return renderWrong(v);
}

/* ── 배우기 ── */
function renderLearn(v){
  LEARN.forEach(c=>{
    v.appendChild(el(`<div class="card">
      <span class="pill">${c.unit||''}</span>
      <h3>${c.t}</h3>
      <div class="body">${c.body}</div>
    </div>`));
  });
  v.appendChild(el(`<div class="card row">
    <b>다 읽었으면</b>
    <button class="btn btn-primary" id="goPractice">✏️ 연습 ${CFG.practiceN}문항 풀어보기</button>
    <button class="btn" id="goSets">🧪 실습 세트로 가기</button>
  </div>`));
  $('#goPractice').onclick = ()=>document.querySelector('[data-view="practice"]').click();
  $('#goSets').onclick     = ()=>document.querySelector('[data-view="sets"]').click();
}

/* ── 문제 풀이 ──
   연습  : 고르는 즉시 정답·해설 공개, 점수 실시간, 연출 있음
   종합  : 아무것도 알려주지 않음, 점수 감춤, 연출 없음 (규약 2)  */
function startQuiz(v, mode){
  const n = mode==='exam' ? CFG.examN : CFG.practiceN;
  quiz = { mode, i:0, correct:0, picks:[],
           list: shuffle(QUESTIONS.slice()).slice(0, Math.min(n, QUESTIONS.length)),
           startTime: Date.now() };
  if(!quiz.list.length){ v.appendChild(el('<div class="empty">문항이 아직 없습니다.</div>')); return; }
  drawQ(v);
}

function drawQ(v){
  const q = quiz.list[quiz.i];
  const isExam = quiz.mode==='exam';
  v.innerHTML='';
  v.appendChild(el(`<div class="progress"><i style="width:${quiz.i/quiz.list.length*100}%"></i></div>`));
  const card = el(`<div class="card">
      <div class="qnum">${quiz.i+1} / ${quiz.list.length}
        ${isExam ? '<span class="pill" style="margin-left:6px">채점은 마지막에</span>'
                 : `<span class="pill" style="margin-left:6px">${quiz.correct}개 맞힘</span>`}</div>
      <div class="qtext">${q.q}</div>
      <div id="chs"></div>
      <div id="exp"></div>
    </div>`);
  v.appendChild(card);

  const chs = card.querySelector('#chs');
  q.ch.forEach((c,idx)=>{
    const b = el(`<button class="choice">${idx+1}. ${c}</button>`);
    b.onclick = ()=>pick(v, idx, b);
    chs.appendChild(b);
  });
}

function pick(v, idx, btn){
  const q = quiz.list[quiz.i];
  const ok = idx === q.a;
  quiz.picks.push({q, pick:idx, ok});
  if(ok) quiz.correct++;
  else   pushWrong(q, idx);

  if(quiz.mode==='exam'){
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    return drawQ(v);
  }

  document.querySelectorAll('.choice').forEach((b,i)=>{
    b.disabled = true;
    if(i===q.a) b.classList.add('correct');
    if(i===idx) b.classList.add('picked', ok?'correct':'wrong');
  });
  try{ if(window.FX) ok ? FX.ok(btn) : FX.no(btn); }catch(e){ console.warn('FX', e); }

  const exp = document.querySelector('#exp');
  exp.appendChild(el(`<div class="explain"><b>${ok?'맞았습니다':'정답은 '+(q.a+1)+'번'}</b><br>${q.ex||''}</div>`));
  const next = el(`<div class="row" style="margin-top:12px">
      <button class="btn btn-primary">${quiz.i+1>=quiz.list.length?'결과 보기':'다음 문제 →'}</button></div>`);
  exp.appendChild(next);
  next.querySelector('button').onclick = ()=>{
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    drawQ(v);
  };
}

function pushWrong(q, pick){
  ST.wrong = ST.wrong.filter(w => w.q !== q.q);
  ST.wrong.unshift({ unit:q.unit||'', q:q.q, ch:q.ch, a:q.a, pick, ex:q.ex||'', at:Date.now() });
  ST.wrong = ST.wrong.slice(0, 100);
  save();
}

function finish(v){
  const n   = quiz.list.length;
  const pct = Math.round(quiz.correct / n * 100);
  const sec = Math.round((Date.now() - quiz.startTime)/1000);
  const part = quiz.mode==='exam' ? '종합시험' : '연습';

  v.innerHTML = '';
  v.appendChild(el(`<div class="card" style="text-align:center">
      <div class="score">${pct}점</div>
      <div class="muted">${n}문항 중 ${quiz.correct}개 정답 · ${Math.floor(sec/60)}분 ${sec%60}초</div>
      <div id="rankBox" style="margin-top:12px"></div>
      <div id="rSubmitAnchor" style="margin-top:12px"></div>
    </div>`));

  const bad = quiz.picks.filter(p=>!p.ok);
  if(bad.length){
    v.appendChild(el('<div class="card"><h3>📕 틀린 문제</h3></div>'));
    bad.forEach(p=>{
      v.appendChild(el(`<div class="card">
        <span class="pill">${p.q.unit||''}</span>
        <div class="qtext">${p.q.q}</div>
        <div class="muted">내가 고른 답 : ${p.pick+1}. ${p.q.ch[p.pick]}</div>
        <div style="color:var(--ok);font-weight:700">정답 : ${p.q.a+1}. ${p.q.ch[p.q.a]}</div>
        <div class="explain">${p.q.ex||''}</div>
      </div>`));
    });
  }

  mountSubmit(pct, quiz.correct, n, sec, part, bad);

  try{
    if(window.FX && pct>=60){
      FX.banner({ title: pct>=90?'훌륭합니다!':'통과!', sub:`${part} ${pct}점`,
                  stars: FX.starsFor ? FX.starsFor(pct) : 0 });
    }
  }catch(e){ console.warn('FX', e); }
  try{
    if(window.Rank){
      const res = Rank.award(pct, { mode:`${CFG.toolName} — ${part}` });
      $('#rankBox').innerHTML = Rank.resultBox(res);
    }
  }catch(e){ console.warn('Rank', e); }
}

/* ── 결과 제출 (규약 1) ── */
function mountSubmit(pct, correct, total, sec, part, bad){
  lastResult = {
    mode   : `${CFG.toolName} — ${part}`,
    score  : pct, correct, total,
    wrong  : bad.map(p => `${p.q.unit||''} ${p.q.q.slice(0,24)}… → 정답 ${p.q.a+1}번`),
    durationSec : sec,
  };
  const anchor = $('#rSubmitAnchor');
  if(!(window.ResultCollector && ResultCollector.attach) || !anchor) return;
  const btn = ResultCollector.attach(anchor, ()=>lastResult, {
    id:'rcBtn', className:'btn btn-primary',
    mode: lastResult.mode,
    extra: [`${CFG.toolName} ${part} ${pct}점`],
  });
  if(btn){ btn.style.width='100%'; btn.textContent = `📤 [${part}] 결과 제출`; }
}

/* ── 실습 세트 (따라 하기 체크리스트) ── */
function setState(key){
  if(!ST.sets[key]) ST.sets[key] = { done:[], start:Date.now() };
  return ST.sets[key];
}

function renderSets(v){
  const bar = el('<div class="setbar"></div>');
  SETS.forEach(s=>{
    const st = setState(s.key);
    const n  = st.done.length, tot = s.steps.length;
    const b = el(`<button class="setbtn${s.key===curSet?' on':''}">${s.name} <span class="muted" style="color:inherit">${n}/${tot}</span></button>`);
    b.onclick = ()=>{ curSet = s.key; render('sets'); };
    bar.appendChild(b);
  });
  v.appendChild(bar);

  const S  = SETS.find(x=>x.key===curSet);
  const st = setState(S.key);
  if(!st.start) st.start = Date.now();

  v.appendChild(el(`<div class="card">
      <span class="pill">${S.name}</span>
      <h3>${S.goal}</h3>
      <div class="body muted">${CFG.appName} 을(를) 옆에 띄워 놓고, 한 단계씩 실제로 해 보면서 눌러 체크하세요.</div>
    </div>`));
  v.appendChild(el(`<div class="setnote">💡 ${S.note}</div>`));

  const doneN = S.steps.filter((_,i)=>st.done.includes(i)).length;
  v.appendChild(el(`<div class="progress"><i style="width:${doneN/S.steps.length*100}%"></i></div>`));
  const cnt = el(`<div class="row" style="margin-bottom:10px">
      <b id="setCnt">${doneN} / ${S.steps.length} 단계</b>
      <span class="spacer" style="flex:1"></span>
      <button class="btn" id="setClear">이 세트 다시 시작</button></div>`);
  v.appendChild(cnt);
  $('#setClear').onclick = ()=>{ ST.sets[S.key] = { done:[], start:Date.now() }; save(); render('sets'); };

  S.steps.forEach((s,i)=>{
    const on = st.done.includes(i);
    const row = el(`<div class="step${on?' done':''}" role="checkbox" tabindex="0"
        aria-checked="${on?'true':'false'}">
        <div class="bx">${on?'✓':''}</div>
        <div class="st"><b>${i+1}. ${s.t}</b><span>${s.d||''}</span></div>
      </div>`);
    const toggle = ()=>{
      const idx = st.done.indexOf(i);
      if(idx>=0) st.done.splice(idx,1); else st.done.push(i);
      save();
      try{ if(window.FX && idx<0) FX.ok(row); }catch(e){}
      render('sets');
    };
    row.onclick = toggle;
    row.onkeydown = (e)=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } };
    v.appendChild(row);
  });

  v.appendChild(el(`<div class="card" style="text-align:center">
      <div class="muted">끝냈으면 선생님께 보냅니다</div>
      <div id="setSubmit" style="margin-top:10px"></div>
    </div>`));
  mountSetSubmit(S, st);
}

function mountSetSubmit(S, st){
  const total = S.steps.length;
  const done  = st.done.length;
  const pct   = Math.round(done/total*100);
  const sec   = Math.max(0, Math.round((Date.now() - (st.start||Date.now()))/1000));
  const miss  = S.steps.map((s,i)=>st.done.includes(i)?null:`${i+1}. ${s.t}`).filter(Boolean);

  const payload = {
    mode  : `${CFG.toolName} — 실습 ${S.name}`,
    score : pct, correct: done, total,
    wrong : miss,
    durationSec : sec,
  };
  const anchor = $('#setSubmit');
  if(!(window.ResultCollector && ResultCollector.attach) || !anchor) return;
  /* labels 로 공통 열 이름을 바꾸면 같은 탭에 열이 하나 더 생깁니다(규약 1).
     이 도구는 연습·종합시험 점수도 같은 탭에 쌓이므로 열 이름은 그대로 두고,
     활동(파트) 이름에 「실습」을 넣어 구분합니다. 점수 칸의 값은 완료율입니다. */
  const btn = ResultCollector.attach(anchor, ()=>payload, {
    id:'rcSetBtn', className:'btn btn-primary',
    mode: payload.mode,
    extra: [`${CFG.toolName} ${S.name} ${pct}% 완료`],
  });
  if(btn){ btn.style.width='100%'; btn.textContent = `📤 [${S.name}] 실습 결과 제출`; }
}

/* ── 오답노트 ── */
function renderWrong(v){
  if(!ST.wrong.length){
    v.appendChild(el('<div class="empty">🗒️ 아직 오답이 없어요!<br>연습이나 종합시험을 풀면 여기에 모입니다.</div>'));
    return;
  }
  v.appendChild(el(`<div class="card row">
      <b>${ST.wrong.length}문항</b>
      <button class="btn" id="clrWrong">비우기</button></div>`));
  $('#clrWrong').onclick = ()=>{ ST.wrong=[]; save(); render('wrong'); };
  ST.wrong.forEach(w=>{
    v.appendChild(el(`<div class="card">
      <span class="pill">${w.unit}</span>
      <div class="qtext">${w.q}</div>
      <div class="muted">내가 고른 답 : ${w.pick+1}. ${w.ch[w.pick]}</div>
      <div style="color:var(--ok);font-weight:700">정답 : ${w.a+1}. ${w.ch[w.a]}</div>
      <div class="explain">${w.ex}</div>
    </div>`));
  });
}

$('#hdSub').textContent = `문항 ${QUESTIONS.length} · 개념 ${LEARN.length} · 실습 세트 ${SETS.length}`;
render('learn');
</script>
